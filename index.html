<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>落雁镇 · 蜜月</title>
<link rel="stylesheet" href="style.css?v=19" />
</head>
<body>
<div id="stage">
  <div id="phone">
    <div id="bezel">
      <div id="speaker"></div>
      <div id="cam"></div>
    </div>
    <div id="statusbar">
      <span id="sb-time">21:40</span>
      <span id="sb-right">
        <span id="sb-signal" aria-label="信号"><i></i><i></i><i></i><i></i></span>
        <span id="sb-batt"><b id="sb-batt-fill"></b><em id="sb-batt-num">87</em></span>
      </span>
    </div>
    <main id="screen"></main>
    <div id="grainLayer"></div>
    <div id="vignette"></div>
    <div id="rain"></div>
    <div id="homebar" data-act="home" title="回到主屏幕"></div>
    <div id="notif"></div>
    <div id="toast"></div>
    <div id="overlay" class="hidden"></div>
  </div>
</div>

<div id="boot">
  <div class="boot-noise"></div>
  <h1 class="boot-title">落雁镇</h1>
  <p class="boot-sub">蜜月 · 第一夜</p>
  <p class="boot-line">雁落之处，水不回头。</p>
  <button id="boot-btn">按此开始</button>
  <p class="boot-hint">建议戴耳机 · 关灯 · 约 20 分钟</p>
</div>

<script src="data.js?v=19"></script>
<script src="audio.js?v=19"></script>
<script src="game.js?v=19"></script>
</body>
</html>
